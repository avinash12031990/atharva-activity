 n=n||1;const seen=S.seen[key]=S.seen[key]||[];

/* Stars: 1 for finishing, +1 at 60% right first time, +1 at 90%. Max 3, only for today's plan, only the first time each day. */
function grade(id,frac){
 if(!inPlan(id)||isDone(id))return 0;
 const n=1+(frac>=.6?1:0)+(frac>=.9?1:0);star(n);finishAct(id);return n}
const sayClean=h=>{const d=document.createElement("div");d.innerHTML=h.replace(/<\/(p|div|h\d)>/g," ");d.querySelectorAll("button").forEach(b=>b.remove());
 return d.textContent.replace(/₹\s*(\d+)/g,"$1 rupees").replace(/=\s*\?/g," equals what").replace(/,\s*\?/g,", what").replace(/−/g," minus ").replace(/\+/g," plus ").replace(/×/g," times ").replace(/=/g," equals ").replace(/\s+/g," ").trim()};
const optSay=o=>{const c=sayClean(String(o));const t=c.replace(/[^\p{L}\p{M}\p{N}\s'.,]/gu,"").replace(/\s+/g," ").trim();return t||c};
const fx=t=>String(t).replace(/₹\s*(\d+)/g,"$1 rupees").replace(/−/g," minus ").replace(/\+/g," plus ");
function speakSeq(chunks){
 try{speechSynthesis.cancel()}catch(e){}
 if(window.AndroidTTS){speak(chunks[0][0],chunks[0][1]);return}
 chunks.forEach(([t,l])=>{try{const u=new SpeechSynthesisUtterance(fx(t));u.lang=LANG[l]||"en-IN";u.rate=.85;speechSynthesis.speak(u)}catch(e){}})}
const ALMOST=["Almost there!","Nearly there!","So close!","Keep going, you can do it!"];
function quiz(qs,id,title,after){
 let i=0,got=0,tries=0;const my=++qtok;
 const show=()=>{
  if(i>=qs.length){const n=grade(id,got/qs.length);if(after)after(n);return end(title,n)}
  const q=qs[i];tries=0;const ol=q.ol||"en";
  const chunks=q.say||[[sayClean(q.html),"en"]];
  $("#app").innerHTML=`<div class="top"><button class="back" onclick="home()">⬅ Home</button><span><button class="back" id="qs" aria-label="Hear the question">🔊 Hear</button> <button class="back" id="qa" aria-label="Read questions automatically">${S.autoread?"Auto: on":"Auto: off"}</button> ${skipBtn()}</span><span class="pill">⭐ ${bal()}</span></div>
  <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
  <div class="q">${q.html}<div class="opts">${q.o.map((o,k)=>`<div class="ow"><button class="opt" data-k="${k}">${o}</button><button class="ospk" data-s="${k}" aria-label="Hear this answer">🔊</button></div>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div></div>`;
  $("#qs").onclick=()=>speakSeq(chunks);
  $("#qa").onclick=()=>{S.autoread=!S.autoread;save();$("#qa").textContent=S.autoread?"Auto: on":"Auto: off";if(S.autoread)speakSeq(chunks)};
  if(S.autoread)speakSeq(chunks);
  document.querySelectorAll(".ospk").forEach(b=>b.onclick=()=>speakSeq([[optSay(q.o[b.dataset.s]),ol]]));
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const o=q.o[b.dataset.k];
   if(String(o)===String(q.a)){b.classList.add("ok");$("#fb").textContent="";if(!tries)got++;document.querySelectorAll(".opt,.ospk").forEach(x=>x.disabled=true);setTimeout(()=>{if(my===qtok){i++;show()}},800)}
   else{
    tries++;b.disabled=true;b.classList.add(tries==1?"bad":"warn");
    const lead=tries==1?"Not quite.":pick(ALMOST),w=q.why?q.why(o):"",arr=Array.isArray(w)?w:(w?[[w,"en"]]:[]);
    const ch=[[lead,"en"],...arr];
    const fb=$("#fb");fb.className="fb "+(tries==1?"r":"y");fb.textContent=ch.map(c=>c[0]).join(" ");
    if(S.autoread)speakSeq(ch)}});
 };show();
}

/* ---------- Math ---------- */
function mq(t){
 let a,b;
 if(t=="add20"){a=1+R(10);b=1+R(10);return {html:`<div class="big">${a} + ${b} = ?</div>`,o:opts(a+b),a:a+b,why:()=>`${a} plus ${b} makes ${a+b}. Start at ${a} and count up ${b} more.`}}
 if(t=="sub20"){a=5+R(16);b=1+R(a-1);return {html:`<div class="big">${a} − ${b} = ?</div>`,o:opts(a-b),a:a-b,why:()=>`${a} take away ${b} leaves ${a-b}. Start at ${a} and count back ${b}.`}}
 if(t=="pattern"){const st=pick([1,2,5,10]),s=1+R(5);const sq=[0,1,2,3].map(k=>s+st*k);const n=s+st*4;return {html:`<p>What comes next?</p><div class="big">${sq.join(", ")}, ?</div>`,o:opts(n,0),a:n,why:()=>`The numbers go up by ${st} each time. ${sq[3]} plus ${st} is ${n}.`}}
 if(t=="add2"){let t1,t2,o1,o2;do{t1=1+R(8);t2=1+R(8);o1=R(9);o2=R(9)}while(t1+t2>9||o1+o2>9);a=t1*10+o1;b=t2*10+o2;return {html:`<div class="big">${a} + ${b} = ?</div>`,o:opts(a+b),a:a+b,why:()=>`Add the tens: ${t1*10} plus ${t2*10} is ${(t1+t2)*10}. Add the ones: ${o1} plus ${o2} is ${o1+o2}. Together that is ${a+b}.`}}
 if(t=="sub2"){let t1,t2,o1,o2;do{t1=2+R(8);t2=1+R(t1);o1=R(10);o2=R(o1+1)}while(t1*10+o1<=t2*10+o2);a=t1*10+o1;b=t2*10+o2;return {html:`<div class="big">${a} − ${b} = ?</div>`,o:opts(a-b),a:a-b,why:()=>`Take away the tens: ${t1*10} minus ${t2*10} is ${(t1-t2)*10}. Take away the ones: ${o1} minus ${o2} is ${o1-o2}. So the answer is ${a-b}.`}}
 return mq(pick(["add20","sub20","pattern","add2","sub2"]))}

const HINT={a:"a as in about",aa:"aa as in car",i:"i as in sit",ee:"ee as in see",u:"u as in put",oo:"oo as in moon",e:"e as in egg",ay:"ay as in play",ai:"ai as in aisle",o:"o as in go",oh:"o as in go",au:"ow as in cow"};

const LNAME={hi:"Hindi",kn:"Kannada"};
const sndOf=(L,ch)=>(SEQ[L].find(x=>x[0]==ch)||["",""])[1];
function letQs(L,target,pool,useAudio){
 const out=[];
 target.forEach(l=>{
  const others=pool.filter(x=>x[0]!==l[0]);
  const optsL=shuf([l[0],...shuf(others).slice(0,2).map(x=>x[0])]);
  out.push({html:`<p>Tap the letter that says</p><div class="big" style="font-size:64px">“${l[1]}”</div>`,o:optsL,a:l[0],ol:L,
   say:[["Tap the letter that says "+l[1],"en"]],
   why:o=>`${o==l[0]?"":o+" says "+sndOf(L,o)+". "}The letter that says ${l[1]} is the other one. Look at its shape and try again.`});
  if(useAudio){
   out.push({html:`<p>Tap the letter you hear</p><div class="big" style="font-size:54px">🔊</div>`,o:optsL,a:l[0],ol:L,
    say:[["Tap the letter you hear","en"],[l[0],L]],
    why:o=>`That letter says ${sndOf(L,o)}. The letter you heard says ${l[1]}.`})}
  else{
   const sOpts=shuf([l[1],...shuf(others).slice(0,2).map(x=>x[1])]);
   out.push({html:`<p>What sound does this letter make?</p><div class="big" style="font-size:90px">${l[0]}</div>`,o:sOpts,a:l[1],ol:"en",
    say:[["What sound does this letter make?","en"],[l[0],L]],
    why:()=>`This letter says ${l[1]}. ${HINT[l[1]]?HINT[l[1]]+".":""}`})}});
 return out}
function runLetters(L,ov){
 const lp=S.lp[L],seq=SEQ[L],planned=!ov&&inPlan(curId)&&!isDone(curId);
 const known=Math.max(lp,2);
 let target,pool;
 if(planned){target=seq.slice(lp,lp+2);pool=seq.slice(0,Math.max(lp+2,3))}
 else{target=shuf(seq.slice(0,known)).slice(0,2);pool=seq.slice(0,Math.max(known,3))}
 const id=curId;
 const cards=target.map(l=>`<div class="card"><span class="w" style="font-size:84px;min-width:110px;text-align:center">${l[0]}</span><div><span class="w" style="font-size:30px">says “${l[1]}”</span><small>${HINT[l[1]]||"Say it out loud together."}</small></div><button class="speak" onclick="speak('${l[0]}','${L}')" aria-label="Hear the letter">🔊</button></div>`);
 $("#app").innerHTML=`<div class="top"><button class="back" onclick="home()">⬅ Home</button>${skipBtn()}</div><h1>${LNAME[L]} letters</h1><p class="note">${planned?"Two new letters today.":"Practice time."} Tap 🔊 and say each letter together. If you cannot hear a voice, just say the sound out loud.</p>${cards.join("")}<div class="center"><button class="go" id="gq">Quiz time!</button></div>`;
 $("#gq").onclick=()=>{
  const qs=letQs(L,target,pool,hasVoice(L));
  if(lp>0&&planned)qs.push(...letQs(L,[pick(seq.slice(0,lp))],pool,false).slice(0,1));
  quiz(qs,id,LNAME[L]+" letters",n=>{if(planned&&n>0){S.lp[L]=Math.min(lp+2,seq.length-2);save()}})}}
function runReview(){
 const id=curId,qs=[];
 fresh("rev",EW,2).forEach(w=>qs.push(wordQ(w,EW)));
 ["hi","kn"].forEach(L=>{if(S.lp[L]>0){const learned=SEQ[L].slice(0,S.lp[L]);qs.push(...letQs(L,[pick(learned)],SEQ[L].slice(0,Math.max(S.lp[L],3)),false).slice(0,1))}});

function wordQ(w,pool){
 const d=shuf(pool.filter(x=>x!==w)).slice(0,2);

/* ---------- Chess ---------- */
const PIECE={pawn:["♟","The pawn walks straight forward, one step. On its very first move it may hop two steps!"],rook:["♜","The rook slides in straight lines: up, down, left or right."],bishop:["♝","The bishop slides diagonally, like a slanted line."]};
const PRULE={pawn:"The pawn moves straight forward.",rook:"The rook moves in a straight line, up, down, left or right.",bishop:"The bishop moves in a slanted line, called a diagonal."};
function legal(p,r,c){const s=new Set(),add=(a,b)=>{if(a>=0&&a<8&&b>=0&&b<8)s.add(a*8+b)};
 if(p=="pawn"){add(r-1,c);if(r==6)add(r-2,c)}
 else if(p=="rook"){for(let k=0;k<8;k++){if(k!=r)add(k,c);if(k!=c)add(r,k)}}
 else{for(let k=-7;k<8;k++){if(k){add(r+k,c+k);add(r+k,c-k)}}}return s}
function runGame(ov){const G=ov||PLAN[day].game;begin(ov?"more":"game"+day);if(G=="sudoku")return sudoku();
 const id=curId;let i=0,good=0;const N=5;
 const round=()=>{
  if(i>=N){const n=grade(id,good/N);return end("Chess practice",n)}
  const g=G=="chessmix"?pick(["pawn","rook","bishop"]):G;const r=g=="pawn"?2+R(5):R(8),c=R(8),L=legal(g,r,c);let h="";
  for(let k=0;k<64;k++){const rr=k>>3,cc=k&7;h+=`<button class="sq ${(rr+cc)%2?"dk":""} ${k==r*8+c?"pc":""}" data-k="${k}">${k==r*8+c?PIECE[g][0]:""}</button>`}
  $("#app").innerHTML=`<div class="top"><button class="back" onclick="home()">⬅ Home</button>${skipBtn()}<span class="pill">⭐ ${bal()}</span></div><div class="bar"><i style="width:${i/N*100}%"></i></div>
  <p class="center">${PIECE[g][1]} <button class="speak" style="width:44px;height:44px;font-size:22px" onclick="speak(PIECE['${g}'][1],'en')" aria-label="Hear it">🔊</button><br><b>Tap a square where it can go.</b></p><div class="fb" id="fb" aria-live="polite"></div><div class="board">${h}</div>`;
  let tried=0;document.querySelectorAll(".sq").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k==r*8+c)return;
   if(L.has(k)){b.classList.add("ok");$("#fb").textContent="";if(!tried)good++;document.querySelectorAll(".sq").forEach(x=>x.disabled=true);setTimeout(()=>{if(curId===id){i++;round()}},800)}
   else{tried++;b.classList.add(tried==1?"bad":"warn");const lead=tried==1?"Not quite.":pick(ALMOST);const fb=$("#fb");fb.className="fb "+(tried==1?"r":"y");fb.textContent=lead+" "+PRULE[g];if(S.autoread)speakSeq([[lead+" "+PRULE[g],"en"]])}})};round()}

/* ---------- Sudoku 4x4 ---------- */
function sudoku(){
 const id=curId;
 const base=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],perm=shuf([1,2,3,4]);
 const sol=base.map(r=>r.map(v=>perm[v-1])),g=sol.map(r=>r.slice()),given=g.map(r=>r.map(()=>true));
 shuf([...Array(16).keys()]).slice(0,7).forEach(k=>{g[k>>2][k&3]=0;given[k>>2][k&3]=false});
 let sel=-1,wrong=0,msg="",streakW=0;
 const ok=(r,c,v)=>{for(let k=0;k<4;k++){if(k!=c&&g[r][k]==v)return false;if(k!=r&&g[k][c]==v)return false}
  const br=r&~1,bc=c&~1;for(let a=0;a<2;a++)for(let b=0;b<2;b++)if((br+a!=r||bc+b!=c)&&g[br+a][bc+b]==v)return false;return true};
 const why=(r,c,v)=>{for(let k=0;k<4;k++){if(k!=c&&g[r][k]==v)return `${v} is already in this row.`;if(k!=r&&g[k][c]==v)return `${v} is already in this column.`}return `${v} is already in this box.`};
 const draw=()=>{let h="";for(let k=0;k<16;k++){const r=k>>2,c=k&3,v=g[r][c];
  h+=`<button class="sc ${given[r][c]?"g":""} ${k==sel?"sel":""} ${c==1?"r2":""} ${r==1?"b2":""} ${v?"cl"+(v-1):""}" data-k="${k}">${v||""}</button>`}
  $("#app").innerHTML=`<div class="top"><button class="back" onclick="home()">⬅ Home</button>${skipBtn()}<span class="pill">⭐ ${bal()}</span></div>
  <p class="center">Use 1, 2, 3, 4 once in every row, column and box.<br><b>Tap an empty square, then a number.</b></p><div class="fb ${streakW>1?"y":"r"}" id="fb" aria-live="polite">${msg}</div><div class="sud">${h}</div>
  <div class="opts">${[1,2,3,4].map(n=>`<button class="opt" style="min-width:80px" data-n="${n}">${n}</button>`).join("")}</div>`;
  document.querySelectorAll(".sc").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(!given[k>>2][k&3]){sel=k;draw()}});
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{if(sel<0)return;const r=sel>>2,c=sel&3,n=+b.dataset.n;
   if(ok(r,c,n)){g[r][c]=n;sel=-1;msg="";streakW=0;if(g.every(x=>x.every(y=>y))){const s=grade(id,clamp(1-wrong/7,0,1));return end("Mini sudoku",s)}draw()}
   else{wrong++;streakW++;const lead=streakW>1?pick(ALMOST):"Not quite.";const t=lead+" "+why(r,c,n);msg=t;const cell=document.querySelector(`.sc[data-k="${sel}"]`);cell.classList.add("bad");const fb=$("#fb");fb.className="fb "+(streakW>1?"y":"r");fb.textContent=t;setTimeout(()=>cell.classList.remove("bad"),500);if(S.autoread)speakSeq([[t,"en"]])}})};
 draw()}

/* ---------- Maze ---------- */
function mazeGen(n){
 const c=Array.from({length:n*n},()=>({N:1,S:1,E:1,W:1,v:0}));
 const st=[0];c[0].v=1;
 while(st.length){
  const i=st[st.length-1],r=(i/n)|0,q=i%n,nb=[];
  if(r>0&&!c[i-n].v)nb.push(["N",i-n,"S"]);if(r<n-1&&!c[i+n].v)nb.push(["S",i+n,"N"]);
  if(q>0&&!c[i-1].v)nb.push(["W",i-1,"E"]);if(q<n-1&&!c[i+1].v)nb.push(["E",i+1,"W"]);
  if(!nb.length){st.pop();continue}
  const [d,j,o]=pick(nb);c[i][d]=0;c[j][o]=0;c[j].v=1;st.push(j)}
 return c}
function runMaze(){
 const id=curId,lvl=S.mazeLevel||0,sizes=[5+lvl,6+lvl];let m=0;
 const play=()=>{
  if(curId!==id)return;
  if(m>=2){const planned=inPlan(id)&&!isDone(id);const s=grade(id,1);if(planned){S.mazeLevel=Math.min(lvl+1,3);save()}return end("Maze",s)}
  const n=sizes[m],cs=44,pad=14,W=n*cs+pad*2,cells=mazeGen(n);let r=0,q=0;const trail=[[0,0]];
  let walls="";
  for(let i=0;i<n*n;i++){const y=(i/n|0)*cs+pad,x=(i%n)*cs+pad,k=cells[i];
   if(k.N)walls+=`<line x1="${x}" y1="${y}" x2="${x+cs}" y2="${y}"/>`;if(k.W)walls+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+cs}"/>`;
   if((i/n|0)==n-1&&k.S)walls+=`<line x1="${x}" y1="${y+cs}" x2="${x+cs}" y2="${y+cs}"/>`;if(i%n==n-1&&k.E)walls+=`<line x1="${x+cs}" y1="${y}" x2="${x+cs}" y2="${y+cs}"/>`}
  $("#app").innerHTML=`<div class="top"><button class="back" onclick="home()">⬅ Home</button>${skipBtn()}<span class="pill">Maze ${m+1} of 2</span></div>
  <p class="center"><b>Slide your finger to take the mouse 🐭 to the cheese 🧀</b></p>
  <div class="stage"><svg id="mz" viewBox="0 0 ${W} ${W}" style="touch-action:none;max-height:62vh"><rect width="${W}" height="${W}" rx="14" fill="#fff6e0"/>
  <polyline id="tr" fill="none" stroke="#ff7a3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
  <g stroke="#2b2a4c" stroke-width="5" stroke-linecap="round">${walls}</g>
  <text x="${pad+(n-1)*cs+cs/2}" y="${pad+(n-1)*cs+cs/2+12}" font-size="34" text-anchor="middle">🧀</text>
  <text id="pl" font-size="34" text-anchor="middle">🐭</text></svg></div>
  <div class="dpad"><button data-d="N" aria-label="Up">⬆️</button><div><button data-d="W" aria-label="Left">⬅️</button><button data-d="S" aria-label="Down">⬇️</button><button data-d="E" aria-label="Right">➡️</button></div></div>`;
  const draw=()=>{const x=pad+q*cs+cs/2,y=pad+r*cs+cs/2;$("#pl").setAttribute("x",x);$("#pl").setAttribute("y",y+12);
   $("#tr").setAttribute("points",trail.map(([a,b])=>`${pad+b*cs+cs/2},${pad+a*cs+cs/2}`).join(" "))};
  let won=false;
  const win=()=>{if(won)return;won=true;speak("You did it!","en");setTimeout(()=>{if(curId===id){m++;play()}},900)};
  const step=d=>{const k=cells[r*n+q];if(k[d])return false;
   if(d=="N")r--;if(d=="S")r++;if(d=="W")q--;if(d=="E")q++;
   const l=trail.length;if(l>1&&trail[l-2][0]==r&&trail[l-2][1]==q)trail.pop();else trail.push([r,q]);
   draw();if(r==n-1&&q==n-1)win();return true};
  const toward=(tr,tq)=>{let guard=0;while((r!=tr||q!=tq)&&guard++<20&&!won){
   const dr=tr-r,dq=tq-q;let d=Math.abs(dr)>=Math.abs(dq)?(dr<0?"N":"S"):(dq<0?"W":"E");
   if(!step(d)){const alt=Math.abs(dr)>=Math.abs(dq)?(dq?(dq<0?"W":"E"):null):(dr?(dr<0?"N":"S"):null);if(!alt||!step(alt))break}}};
  const svg=$("#mz");let down=false;
  const cellAt=e=>{const b=svg.getBoundingClientRect(),sc=W/b.width;return [clamp(Math.floor(((e.clientY-b.top)*sc-pad)/cs),0,n-1),clamp(Math.floor(((e.clientX-b.left)*sc-pad)/cs),0,n-1)]};
  svg.onpointerdown=e=>{down=true;try{svg.setPointerCapture(e.pointerId)}catch(x){}toward(...cellAt(e))};
  svg.onpointermove=e=>{if(down)toward(...cellAt(e))};
  svg.onpointerup=svg.onpointercancel=()=>{down=false};
  document.querySelectorAll(".dpad button").forEach(b=>b.onclick=()=>step(b.dataset.d));
  draw()};
 play()}

  words=fresh("ws",bank,4);grid=Array.from({length:N},()=>Array(N).fill(""));let ok=true;
  for(const w of words){let placed=false;
   for(let t=0;t<80&&!placed;t++){const h=R(2)==0,r=R(h?N:N-w.length+1),c=R(h?N-w.length+1:N);let fit=true;
    for(let i=0;i<w.length;i++){const g=grid[h?r:r+i][h?c+i:c];if(g&&g!==w[i]){fit=false;break}}
    if(fit){for(let i=0;i<w.length;i++)grid[h?r:r+i][h?c+i:c]=w[i];placed=true}}
   if(!placed){ok=false;break}}
  if(ok)break}
 const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
 for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])grid[r][c]=A[R(26)];
 const found=new Set(),foundCells=new Set();let first=null,wrong=0;
 const draw=()=>{
  $("#app").innerHTML=`<div class="top"><button class="back" onclick="home()">⬅ Home</button>${skipBtn()}<span class="pill">${found.size} of ${words.length}</span></div>
  <p class="center"><b>Tap the first letter, then the last letter of a word</b></p>
  <div class="wl">${words.map(w=>`<span class="${found.has(w)?"fd":""}">${WEM[w]||""} ${w}</span>`).join("")}</div>
  <div class="ws">${grid.map((row,r)=>row.map((ch,c)=>`<button class="wc ${foundCells.has(r+","+c)?"fd":""} ${first&&first[0]==r&&first[1]==c?"sel":""}" data-r="${r}" data-c="${c}">${ch}</button>`).join("")).join("")}</div>`;
  document.querySelectorAll(".wc").forEach(b=>b.onclick=()=>{
   const r=+b.dataset.r,c=+b.dataset.c;
   if(!first){first=[r,c];return draw()}
   const [r0,c0]=first;first=null;
   if(r0!=r&&c0!=c){wrong++;return draw()}
   const cells=[];const dr=Math.sign(r-r0),dc=Math.sign(c-c0),len=Math.max(Math.abs(r-r0),Math.abs(c-c0))+1;
   for(let i=0;i<len;i++)cells.push([r0+dr*i,c0+dc*i]);
   const s=cells.map(([a,b])=>grid[a][b]).join(""),w=words.find(x=>!found.has(x)&&(x===s||x===[...s].reverse().join("")));
   if(w){found.add(w);cells.forEach(([a,b])=>foundCells.add(a+","+b));speak(w.toLowerCase(),"en");
    if(found.size==words.length){const st=grade(id,clamp(1-wrong/6,0,1));draw();return setTimeout(()=>{if(curId===id)end("Word search",st)},900)}}
   else wrong++;
   draw()})};
 draw()}

/* ---------- Word guess ---------- */
function runWordGuess(){
 const id=curId,items=fresh("wg",WG,4);let i=0,wrong=0,hints=0;
 const round=()=>{
  if(curId!==id)return;
  if(i>=items.length){document.onkeydown=null;const s=grade(id,clamp(1-(wrong+hints)/12,0,1));return end("Word guess",s)}
  const [w,clue,pic]=items[i];let done=false,usedPic=false;const used={};
  $("#app").innerHTML=`<div class="top"><button class="back" onclick="home()">⬅ Home</button>${skipBtn()}<span class="pill">Word ${i+1} of ${items.length}</span></div>
  <div class="bar"><i style="width:${i/items.length*100}%"></i></div>
  <div class="q"><p class="wgc">${clue}</p><p><button class="speak" id="wgs" style="width:56px;height:56px;font-size:26px" aria-label="Hear the clue">🔊</button> <button class="back" id="wgp">🖼️ Show a picture</button></p>
  <div class="pichint" id="wgi"></div>
  <div class="blanks" id="bls">${[...w].map((c,k)=>`<span class="bl" id="bl${k}"></span>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div></div>
  <div class="kb">${"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l=>`<button data-l="${l}">${l}</button>`).join("")}</div>`;
  const hear=()=>speak(clue,"en");
  $("#wgs").onclick=hear;if(S.autoread)hear();
  $("#wgp").onclick=()=>{if(!usedPic){usedPic=true;hints++}$("#wgi").textContent=pic};
  const press=L=>{
   if(done||used[L])return;used[L]=1;
   const btn=document.querySelector(`.kb button[data-l="${L}"]`);if(!btn)return;btn.disabled=true;
   if(w.includes(L)){btn.classList.add("good");[...w].forEach((c,k)=>{if(c==L)$("#bl"+k).textContent=L});$("#fb").textContent="";
    if([...w].every((c,k)=>$("#bl"+k).textContent)){done=true;document.onkeydown=null;speak(w.toLowerCase(),"en");$("#fb").className="fb g";$("#fb").textContent="🎉 "+w+"!";setTimeout(()=>{if(curId===id){i++;round()}},1600)}}
   else{wrong++;btn.classList.add("bad");$("#fb").className="fb r";$("#fb").textContent="No "+L+" in this word. Try another letter."}};
  document.querySelectorAll(".kb button").forEach(b=>b.onclick=()=>press(b.dataset.l));
  document.onkeydown=e=>{if(/^[a-z]$/i.test(e.key))press(e.key.toUpperCase())}};
 round()}

const pad2=n=>String(n).padStart(2,"0");
const clockWords=(h,m)=>m==0?`${h} o'clock`:m==30?`half past ${h}`:m==15?`quarter past ${h}`:m==45?`quarter to ${h%12+1}`:`${h}:${pad2(m)}`;
const clockInner=(h,m,ids)=>{
 const ha=((h%12)+m/60)*30,ma=m*6;
 let nums="",ticks="";
 for(let k=1;k<=12;k++){const a=k*Math.PI/6;nums+=`<text x="${200+124*Math.sin(a)}" y="${200-124*Math.cos(a)+12}" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2a4c" font-family="Trebuchet MS,Segoe UI,sans-serif">${k}</text>`}
 for(let k=0;k<60;k++){const a=k*Math.PI/30,r1=k%5?160:150;ticks+=`<line x1="${200+r1*Math.sin(a)}" y1="${200-r1*Math.cos(a)}" x2="${200+168*Math.sin(a)}" y2="${200-168*Math.cos(a)}" stroke="#2b2a4c" stroke-width="${k%5?2:4}"/>`}
 return `<g data-p="face"><circle cx="200" cy="200" r="178" fill="#fff" stroke="#2b2a4c" stroke-width="10"/>${ticks}${nums}</g>
 <g data-p="hour"><g ${ids?'id="hh"':""} transform="rotate(${ha} 200 200)"><line x1="200" y1="212" x2="200" y2="128" stroke="#e5484d" stroke-width="16" stroke-linecap="round"/></g></g>
 <g data-p="minute"><g ${ids?'id="mh"':""} transform="rotate(${ma} 200 200)"><line x1="200" y1="214" x2="200" y2="62" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/></g></g>
 <circle cx="200" cy="200" r="11" fill="#2b2a4c"/>`};
const clockStatic=(h,m)=>`<svg viewBox="0 0 400 400" width="270" height="270" role="img" aria-label="A clock">${clockInner(h,m,false)}</svg>`;
SCI.clock={icon:"🕒",title:"Reading the clock",blurb:"How do we tell the time?",
 svg:`<svg viewBox="0 0 400 450" role="img" aria-label="Analog clock">${clockInner(10,8,true)}<text id="ctx" x="200" y="436" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2a4c" font-family="Trebuchet MS,Segoe UI,sans-serif"></text></svg>`,
 tryHtml:`<p><b>Hour</b></p><input type="range" id="sh" min="1" max="12" step="1" value="3" aria-label="Hour"><p><b>Minutes</b></p><input type="range" id="sm" min="0" max="45" step="15" value="0" aria-label="Minutes"><p class="note">Minutes: 0 = o'clock, 15 = quarter past, 30 = half past, 45 = quarter to</p>`,
 steps:[
 {t:"This is a clock. It tells us the time. It has the numbers 1 to 12.",dur:11,hi:["face"]},
 {t:"The short, fat, red hand is the hour hand. It tells us the hour.",dur:11,hi:["hour"]},
 {t:"The long, thin, blue hand is the minute hand. Watch it go all the way round. That takes one hour.",dur:14,hi:["minute"]},
 {t:"When the long hand points to 12, it is o'clock. Look: 3 o'clock, 4 o'clock, 5 o'clock.",dur:15,hi:["minute"]},
 {t:"When the long hand points to 6, it is half past. Half past 3, half past 4, half past 5.",dur:15,hi:["minute"]},
 {t:"When the long hand points to 3, it is quarter past. When it points to 9, it is quarter to the next hour.",dur:16,hi:["minute"]},
 {t:"Now you try! Move the sliders to set the time. Make it half past 6!",try:true,hi:[]}],
 bind(st){st.user.h=3;st.user.m=0;$("#sh").oninput=e=>{st.user.h=+e.target.value};$("#sm").oninput=e=>{st.user.m=+e.target.value}},
 tick(st){
  const E=st.E,s=st.step,sp=st.sp;let h=10,m=8;
  if(s===0){h=10;m=8}else if(s===1){h=3;m=0}
  else if(s===2){h=3;m=Math.min(59,Math.floor(sp/13*60))}
  else if(s===3){h=3+Math.min(2,Math.floor(sp/4.5));m=0}
  else if(s===4){h=3+Math.min(2,Math.floor(sp/4.5));m=30}
  else if(s===5){if(sp<8){h=3;m=15}else{h=3;m=45}}
  else{h=st.user.h||3;m=st.user.m||0}
  E("hh").setAttribute("transform",`rotate(${((h%12)+m/60)*30} 200 200)`);E("mh").setAttribute("transform",`rotate(${m*6} 200 200)`);
  E("ctx").textContent=s===0?"":s===2?`${h}:${pad2(m)}`:`${clockWords(h,m)}  (${h}:${pad2(m)})`;
 },
 quiz(){const out=[];
  shuf(["o","o","h","h","q"]).forEach(k=>{const h=1+R(12),m=k=="o"?0:k=="h"?30:pick([15,45]),ans=clockWords(h,m),d=new Set();
   while(d.size<2){const w=clockWords(Math.random()<.5?h:1+R(12),pick([0,15,30,45]));if(w!==ans)d.add(w)}
   out.push({html:`<p>What time does the clock show?</p>${clockStatic(h,m)}`,o:shuf([ans,...d]),a:ans,say:[["What time does the clock show?","en"]],why:()=>clockWhy(h,m)})});
  return out}};
